version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_BASE_BACKEND=http://localhost:3001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
      - backend_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    environment:
      - SQLITE_PATH=/app/data/sqlite.db

volumes:
  sqlite_data:
  frontend_node_modules:
  backend_node_modules: